[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "penhin-plugin-media-understanding"
version = "0.1.0"
description = "Bounded local media understanding with a Penhin Plugin adapter"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
local = ["Pillow==13.0.0", "pypdfium2==5.14.0", "av==19.0.2"]
ollama = ["httpx==0.28.1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.entry-points."penhin.plugins"]
media_understanding = "penhin_media:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penhin_media = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the real Penhin core", "model: requires a local vision model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
