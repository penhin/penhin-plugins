[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "penhin-plugin-knowledge-retrieval"
version = "0.1.0"
description = "Local source-preserving knowledge retrieval with a Penhin Plugin adapter"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.entry-points."penhin.plugins"]
knowledge_retrieval = "penhin_knowledge:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penhin_knowledge = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the real Penhin core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
