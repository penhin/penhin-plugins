name: Media understanding

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked native and HTTP dependencies
        run: python -m pip install --require-hashes -r plugins/media_understanding/requirements-local.lock
      - name: Install plugin and test tools
        run: python -m pip install -e "./plugins/media_understanding[dev]"
      - name: Real media decoding and service contracts
        run: python -m pytest plugins/media_understanding/tests -q -m "not integration and not model"
      - name: Lint
        run: python -m ruff check plugins/media_understanding
      - name: Format
        run: python -m ruff format --check plugins/media_understanding/src plugins/media_understanding/tests
      - name: Build wheel and sdist
        run: python -m build plugins/media_understanding
      - name: Check installed wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y penhin-plugin-media-understanding
          python -m pip install --no-deps plugins/media_understanding/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import entry_points; from penhin_media import MediaService; assert any(p.name == 'media_understanding' for p in entry_points(group='penhin.plugins'))"
