name: Knowledge retrieval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install plugin and test tools
        run: python -m pip install -e "./plugins/knowledge_retrieval[dev]"
      - name: Real SQLite retrieval, provenance, authorization and lifecycle
        run: python -m pytest plugins/knowledge_retrieval/tests -q -m "not integration"
      - name: Lint
        run: python -m ruff check plugins/knowledge_retrieval
      - name: Format
        run: python -m ruff format --check plugins/knowledge_retrieval/src plugins/knowledge_retrieval/tests plugins/knowledge_retrieval/examples
      - name: Build wheel and sdist
        run: python -m build plugins/knowledge_retrieval
      - name: Check installed wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y penhin-plugin-knowledge-retrieval
          python -m pip install --no-deps plugins/knowledge_retrieval/dist/*.whl
          cp plugins/knowledge_retrieval/examples/local_search.py "$RUNNER_TEMP/knowledge_demo.py"
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import entry_points; from penhin_knowledge import KnowledgeService; assert any(p.name == 'knowledge_retrieval' for p in entry_points(group='penhin.plugins'))"
          python knowledge_demo.py
