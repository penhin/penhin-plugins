name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check plugin catalog and documentation
        run: python scripts/check_repository.py
      - name: Install ASR service and test tools
        run: python -m pip install -e "./plugins/asr[dev]"
      - name: ASR batch, streaming and worker contracts
        run: python -m pytest plugins/asr/tests -q -m "not integration and not model"
      - name: Lint
        run: python -m ruff check plugins/asr/src plugins/asr/tests
      - name: Format
        run: python -m ruff format --check plugins/asr/src plugins/asr/tests
      - name: Build wheel and sdist
        run: python -m build plugins/asr
      - name: Check installed wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y penhin-plugin-asr
          python -m pip install --no-deps plugins/asr/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import entry_points; from penhin_asr import AsrService, VoiceSubmission, ZipformerBackend; assert any(p.name == 'asr' for p in entry_points(group='penhin.plugins'))"
