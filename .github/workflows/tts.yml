name: TTS plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install TTS and test tools
        run: python -m pip install -e "./plugins/tts[dev]"
      - name: Service, playback, cancellation and worker contracts
        run: python -m pytest plugins/tts/tests -q -m "not integration and not model"
      - name: Lint
        run: python -m ruff check plugins/tts/src plugins/tts/tests plugins/tts/examples
      - name: Format
        run: python -m ruff format --check plugins/tts/src plugins/tts/tests plugins/tts/examples
      - name: Build
        run: python -m build plugins/tts
      - name: Verify wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y penhin-plugin-tts
          python -m pip install --no-deps plugins/tts/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import entry_points; from penhin_tts import TtsService, MeloBackend, SpeechPlayer; assert any(p.name == 'tts' for p in entry_points(group='penhin.plugins'))"
